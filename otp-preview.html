<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>معاينة لوحة التحكم</title>
<style>
:root{--bg:#e9edf5;--cd:#fff;--tx:#212529;--mu:#6c757d;--bd:#dee2e6;--bl:#2f8fd8;--bl2:#1d68b0;--rd:#d9363e;--rd2:#a31d27}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151f;--cd:#1c2030;--tx:#e8eaf2;--mu:#9aa1b5;--bd:#2d3347}}
*{box-sizing:border-box}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--cd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,50,90,.08)}
h1{font-size:24px;text-align:center;margin:10px 0 14px;font-weight:600}h2{font-size:17px;margin:0 0 12px;font-weight:600}
.bn{background:#fff3cd;color:#664d03;border:1px solid #ffecb5;border-radius:10px;padding:12px;text-align:center;font-size:14px;margin-bottom:12px}.bn.x{background:#f8d7da;color:#842029;border-color:#f5c2c7}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top b{font-size:18px;font-weight:500}.ic{display:flex;gap:14px;align-items:center}
.ib{background:none;border:0;font-size:26px;cursor:pointer;position:relative;padding:0;color:var(--tx)}
.bd{position:absolute;top:-6px;left:-8px;background:#dc3545;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;line-height:18px}
label{display:block;font-size:14px;margin:8px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:11px;font:inherit;color:#fff;cursor:pointer;margin-top:12px;background:linear-gradient(#3b9be6,var(--bl2))}
.btn.r{background:linear-gradient(#e0454d,var(--rd2))}.btn.o{background:none;border:1px solid var(--bl);color:var(--bl)}.btn.s{width:auto;display:inline-block;padding:5px 12px;font-size:13px;margin:6px 0 0}
hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
.it{border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px;font-size:15px;word-break:break-all}.it .m{color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-left:5px}
.pg{display:flex;justify-content:center;margin-top:14px;direction:rtl}.pg button{border:1px solid var(--bd);background:var(--cd);color:var(--bl);padding:7px 13px;cursor:pointer;font:inherit}.pg button.on{background:#0d6efd;color:#fff;border-color:#0d6efd}
.msg{font-size:13px;min-height:18px;color:var(--rd)}.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#f5c84b}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--cd);border-radius:12px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);font-size:17px}.mh button{background:none;border:0;font-size:22px;color:var(--tx);cursor:pointer}
.mb{overflow:auto;padding:0 6px}.mf{padding:10px 16px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}td{padding:9px 4px;border-bottom:1px solid var(--bd)}tr:nth-child(odd) td{background:rgba(128,128,128,.08)}
.l{direction:ltr;unicode-bidi:plaintext}
</style></head><body><div class="w" id="app"></div><div id="mo"></div><p style="text-align:center;font-size:12px;color:var(--mu)">نسخة معاينة، البيانات تجريبية وتُمسح عند تحديث الصفحة</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB={u:{email:'goatsub1@gmail.com',plan:'سنوي',exp:Date.parse('2027-09-28')},pw:[{id:1,name:'الأساسية',val:'Ebla@2026'},{id:2,name:'احتياطية',val:'Safe#7788'}],ac:[],ln:[],lg:[],id:10};
const rnd=n=>[...Array(n)].map(()=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.random()*62|0]).join('');
const code6=()=>String(Math.random()*1e6|0).padStart(6,'0');
['dalebeers52+w5e8iknv','aidenblair774+6dm7d6ba','battlelouis413+opo22nb5','annik.atke310','dille.nburgcathrin','bujanghaluk8+11','sara.mkt2026','lina.cafe77','omar.k88','noura.s55','fahad.h12'].forEach((e,i)=>{const id=i+1;DB.ac.push({id,email:e+'@gmail.com',label:i<3?'':'حساب '+(i+1),created:Date.now()-i*864e5*1.5,pw:'Ebla@2026'});for(let k=0;k<(i%3?1:7);k++)DB.ln.push({token:rnd(9),aid:id,total:3,used:k%3,});});
for(let i=0;i<25;i++){const l=DB.ln[i%DB.ln.length];DB.lg.push({token:l.token,code:code6(),ts:Date.now()-i*36e5*1.3})}
const A=async(m,u,b)=>{const [path,qs]=u.split('?'),P=new URLSearchParams(qs||''),[,r,id]=path.split('/');b=b||{};
 if(r=='me')return DB.u;if(r=='log')return DB.lg.slice(0,100);if(r=='logout'||r=='login'||r=='register')return{ok:1};
 if(r=='pwds'){if(m=='GET')return DB.pw;if(m=='DELETE')DB.pw=DB.pw.filter(x=>x.id!=id);else{if(!b.name||!b.val)throw new Error('الاسم وكلمة المرور مطلوبان');if(m=='PUT')Object.assign(DB.pw.find(x=>x.id==id),{name:b.name,val:b.val});else DB.pw.push({id:++DB.id,name:b.name,val:b.val})}return{ok:1}}
 if(r=='accounts'){if(m=='GET'){const q=(P.get('q')||'').toLowerCase(),pg=+P.get('page')||1,f=DB.ac.filter(a=>(a.email+a.label).toLowerCase().includes(q));return{total:f.length,page:pg,pages:Math.max(1,Math.ceil(f.length/10)),items:f.slice((pg-1)*10,pg*10).map(a=>({...a,links:DB.ln.filter(l=>l.aid==a.id).length}))}}
  if(m=='DELETE'){DB.ac=DB.ac.filter(a=>a.id!=id);DB.ln=DB.ln.filter(l=>l.aid!=id);return{ok:1}}
  if(!b.email||!b.pw||!b.secret)throw new Error('البريد وكلمة المرور والمفتاح مطلوبة');DB.ac.unshift({id:++DB.id,email:b.email,label:b.label,created:Date.now(),pw:b.pw});return{ok:1}}
 if(r=='links'){if(m=='GET'){const ai=+P.get('aid')||0,q=P.get('q')||'';return DB.ln.filter(l=>(!ai||l.aid==ai)&&l.token.includes(q)).map(l=>({...l,email:DB.ac.find(a=>a.id==l.aid)?.email,url:location.href.split('#')[0]+'#l-'+l.token}))}
  if(m=='DELETE'){DB.ln=DB.ln.filter(l=>l.token!=id);return{ok:1}}
  const n=+b.count,t=+b.total;if(!(n>=1&&t>=1))throw new Error('قيم غير صحيحة');for(let i=0;i<n;i++)DB.ln.unshift({token:rnd(9),aid:+b.aid,total:t,used:0});return{ok:1}}
 return{}};
function clientPage(t){const l=DB.ln.find(x=>x.token==t),a=l&&DB.ac.find(x=>x.id==l.aid);
 if(!l||!a){app.innerHTML='<div class="card"><h2>الرابط غير صالح</h2></div>';return}
 app.innerHTML=`<div class="card" id="lg"><button class="btn o s" id="bk" style="margin:0 0 10px">← العودة للوحة (معاينة)</button><h2 style="text-align:center">تسجيل الدخول</h2>
 <p style="text-align:center;font-size:12px;color:var(--mu)">للتجربة: ${esc(a.email)} / ${esc(a.pw)}</p>
 <label>البريد الإلكتروني</label><input id="ce" dir="ltr"><label>كلمة المرور</label><input id="cw" type="password" dir="ltr"><div class="msg" id="m"></div><button class="btn" id="cg">دخول</button></div>
 <div class="card" id="ot" style="display:none"><h2 style="text-align:center">الحصول على الكود</h2><p style="text-align:center;font-size:13px;color:var(--mu)">المتبقي <b id="bl"></b> من ${l.total} مرات لطلب الكود</p>
 <div id="cd" style="font-size:40px;letter-spacing:8px;text-align:center;font-weight:700;direction:ltr;cursor:pointer;transition:filter .3s">••••••</div>
 <p id="hn" style="text-align:center;font-size:13px;color:var(--mu)">الكود مغطى، اضغط عليه بعد الطلب لإظهاره (كود تجريبي)</p><button class="btn" id="rq">طلب OTP</button></div>`;
 $('#bk').onclick=()=>{location.hash=''};$('#cd').onclick=()=>$('#cd').style.filter='none';
 $('#cg').onclick=()=>{if($('#ce').value.trim().toLowerCase()!=a.email.toLowerCase()||$('#cw').value!=a.pw){msg('البريد أو كلمة المرور غير صحيحة');return}
  $('#lg').style.display='none';$('#ot').style.display='block';$('#bl').textContent=l.total-l.used;$('#rq').disabled=l.used>=l.total;if(l.used>=l.total)$('#hn').textContent='انتهى الرصيد، لا يمكن طلب كود جديد'};
 $('#rq').onclick=()=>{if(l.used>=l.total)return;l.used++;const c=code6();DB.lg.unshift({token:l.token,code:c,ts:Date.now()});$('#cd').textContent=c;$('#cd').style.filter='blur(12px)';$('#bl').textContent=l.total-l.used;if(l.used>=l.total){$('#rq').disabled=true;$('#hn').textContent='انتهى الرصيد، لا يمكن طلب كود جديد'}}}

const msg=(t,ok)=>{const m=$('#m');if(m){m.style.color=ok?'#1d9a5b':'var(--rd)';m.textContent=t}};
const act=f=>async(...a)=>{try{await f(...a)}catch(e){msg(e.message)}};
const p2=n=>String(n).padStart(2,'0'),dmy=t=>{const d=new Date(t);return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()};
const MSG=u=>'للحصول على بيانات الحساب ادخل على الرابط التالي: '+u+' يجب الإحتفاظ بالرابط';
const cp=async(b,t)=>{try{await navigator.clipboard.writeText(t);b.textContent='تم النسخ'}catch(e){prompt('انسخ:',t)}};
let me,q='',pg=1,pwds=[],open=null;
async function init(){me=await A('GET','/me');location.hash.startsWith('#l-')?clientPage(location.hash.slice(3)):dash()}
addEventListener('hashchange',()=>init());
function auth(mode='in'){
 app.innerHTML=`<h1>لوحة التحكم الإدارية</h1><div class="card"><h2>${mode=='in'?'تسجيل الدخول':'حساب جديد'}</h2>
 <label>البريد الإلكتروني</label><input id="e" type="email" dir="ltr"><label>كلمة المرور (8 أحرف على الأقل)</label><input id="p" type="password" dir="ltr">
 ${mode=='up'?'<label>نوع الاشتراك</label><select id="pl"><option>شهري</option><option>سنوي</option></select>':''}
 <div class="msg" id="m"></div><button class="btn" id="go">${mode=='in'?'دخول':'إنشاء الحساب'}</button>
 <p style="text-align:center;font-size:14px"><a href="#" id="sw" style="color:var(--bl)">${mode=='in'?'ليس لديك حساب؟ سجّل':'لديك حساب؟ ادخل'}</a></p></div>`;
 $('#sw').onclick=e=>{e.preventDefault();auth(mode=='in'?'up':'in')};
 $('#go').onclick=act(async()=>{await A('POST',mode=='in'?'/login':'/register',{email:$('#e').value,password:$('#p').value,plan:$('#pl')?.value});init()});
}
async function dash(){
 pwds=await A('GET','/pwds');const lg=await A('GET','/log');
 const ex=me.exp<Date.now(),name=esc(me.email.split('@')[0]);
 app.innerHTML=`<div class="bn ${ex?'x':''}">${ex?'انتهى اشتراك حسابك في ':'اشتراك حسابك صالح حتى '}${new Date(me.exp).toISOString().slice(0,10)}</div>
 <h1>لوحة التحكم الإدارية</h1>
 <div class="top"><b>مرحباً، ${name}!</b><div class="ic"><button class="ib" id="bell">🔔${lg.length?`<span class="bd">${lg.length}</span>`:''}</button><button class="ib" id="av" title="خروج">👤</button></div></div>
 <div class="card"><h2>🔍 البحث السريع عن عميل</h2><input id="cs" placeholder="ابحث عن عميل باسم المستخدم" dir="ltr"><div id="cr"></div></div>
 <div class="card"><h2>✉️ إدارة الحسابات</h2>
 <label>الإيميل</label><input id="ae" dir="ltr" placeholder="أدخل الإيميل">
 <label>كلمة المرور</label><select id="ap"><option value="">اختر كلمة المرور</option>${pwds.map(p=>`<option value="${esc(p.val)}">${esc(p.name)}</option>`).join('')}<option value="__m">كتابة يدوية…</option></select><input id="av2" dir="ltr" placeholder="كلمة المرور" style="display:none;margin-top:6px">
 <label>اسم الإيميل (اختياري)</label><input id="al" placeholder="أدخل اسمًا للإيميل">
 <label>مفتاح المصادقة الثنائية (صورة QR أو المفتاح)</label><input type="file" id="aq" accept="image/*"><input id="as" dir="ltr" placeholder="المفتاح أو رابط otpauth" style="margin-top:6px">
 <div class="msg" id="m"></div><button class="btn" id="aa">⊕ إضافة الإيميل</button>
 <button class="btn o" id="pm">🔑 إدارة كلمات المرور الثابتة</button><hr>
 <h2 style="font-size:20px">☰ الإيميلات</h2><input id="aqs" placeholder="ابحث بالإيميل أو الاسم" value="${esc(q)}"><div id="al2"></div></div>`;
 $('#bell').onclick=()=>showLog(lg);$('#av').onclick=async()=>{if(confirm('تسجيل الخروج؟')){await A('POST','/logout',{});auth()}};
 let t;$('#cs').oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{const v=e.target.value.trim();if(!v){$('#cr').innerHTML='';return}const r=await A('GET','/links?q='+encodeURIComponent(v));$('#cr').innerHTML=r.slice(0,10).map(clientRow).join('')||'<p class="m" style="color:var(--mu)">لا يوجد عميل بهذا الاسم</p>';bindClients($('#cr'))},300)};
 $('#ap').onchange=e=>{const m=e.target.value=='__m';$('#av2').style.display=m?'block':'none';if(!m)$('#av2').value=e.target.value};
 $('#aq').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r){$('#as').value=r.data;msg('تمت قراءة الـ QR',1)}else msg('تعذّرت قراءة الـ QR')};im.src=URL.createObjectURL(f)};
 $('#aa').onclick=act(async()=>{await A('POST','/accounts',{email:$('#ae').value,pw:$('#av2').value||($('#ap').value=='__m'?'':$('#ap').value),label:$('#al').value,secret:$('#as').value});pg=1;dash()});
 $('#pm').onclick=pwModal;
 $('#aqs').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{q=e.target.value;pg=1;list()},300)};
 list();
}
async function list(){
 const r=await A('GET',`/accounts?q=${encodeURIComponent(q)}&page=${pg}`);
 $('#al2').innerHTML=r.items.map(a=>`<div class="it"><div class="l">${esc(a.email)}</div><div>الإيميل: <span class="l">${esc(a.email)}</span></div>${a.label?`<div>الاسم: ${esc(a.label)}</div>`:''}<div class="m">تاريخ الإنشاء: ${a.created?dmy(a.created):'-'}</div><div class="m"><span class="dot"></span>عدد العملاء: ${a.links}</div>
 <button class="btn o s" data-o="${a.id}">👥 إدارة العملاء</button><div id="c${a.id}"></div><button class="btn r" data-d="${a.id}">🗑 حذف</button></div>`).join('')||'<p style="color:var(--mu)">لا توجد حسابات.</p>';
 if(r.pages>1){let h=`<button ${pg<=1?'disabled':''} data-g="${pg-1}">السابق</button>`;for(let i=1;i<=r.pages;i++)h+=`<button class="${i==pg?'on':''}" data-g="${i}">${i}</button>`;h+=`<button ${pg>=r.pages?'disabled':''} data-g="${pg+1}">التالي</button>`;$('#al2').insertAdjacentHTML('beforeend',`<div class="pg">${h}</div>`)}
 $('#al2').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{pg=+b.dataset.g;list()});
 $('#al2').querySelectorAll('[data-d]').forEach(b=>b.onclick=act(async()=>{if(confirm('حذف الإيميل وكل عملائه؟')){await A('DELETE','/accounts/'+b.dataset.d);list();}}));
 $('#al2').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>clients(+b.dataset.o));
 if(open)clients(open,true);
}
const clientRow=l=>`<div class="it"><div class="l"><b>${esc(l.token)}</b> · ${esc(l.email)}</div><div class="bar"><i style="width:${l.used/l.total*100}%"></i></div><div class="m">استخدم ${l.used} من ${l.total}</div><button class="btn s" data-cm="${esc(l.url)}">نسخ الرسالة</button> <button class="btn o s" data-cl="${esc(l.url)}">نسخ الرابط</button> <button class="btn o s" data-pv="${l.token}">معاينة صفحة العميل</button> <button class="btn r s" data-ld="${l.token}">حذف</button></div>`;
function bindClients(root,again){
 root.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{location.hash='l-'+b.dataset.pv});
 root.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>cp(b,MSG(b.dataset.cm)));
 root.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>cp(b,b.dataset.cl));
 root.querySelectorAll('[data-ld]').forEach(b=>b.onclick=act(async()=>{await A('DELETE','/links/'+b.dataset.ld);again?again():dash()}));
}
async function clients(id,keep){
 const box=$('#c'+id);if(!box)return;if(!keep&&open==id){open=null;box.innerHTML='';return}
 if(!keep&&open)$('#c'+open)&&($('#c'+open).innerHTML='');open=id;
 const ls=await A('GET','/links?aid='+id);
 box.innerHTML=`<div style="margin-top:10px"><label>عدد العملاء الجدد</label><input id="gn" type="number" min="1" value="1"><label>رصيد OTP لكل عميل</label><input id="gb" type="number" min="1" value="3"><div class="msg" id="m"></div><button class="btn s" id="gg" style="width:100%">توليد روابط</button></div>`+ls.map(clientRow).join('');
 $('#gg').onclick=act(async()=>{await A('POST','/links',{aid:id,count:$('#gn').value,total:$('#gb').value});keep=0;open=id;await list()});
 bindClients(box,()=>clients(id,true));
}
function modal(title,body,foot){const m=$('#mo');m.innerHTML=`<div class="mo"><div class="md"><div class="mh"><span>${title}</span><button id="x">✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div></div>`;$('#x').onclick=()=>m.innerHTML='';m.firstChild.onclick=e=>{if(e.target==m.firstChild)m.innerHTML=''}}
function showLog(lg){const now=Date.now();
 modal('🔔 سجل آخر 100 طلب OTP',`<table>${lg.map(r=>{const d=new Date(r.ts),h=Math.floor((now-r.ts)/36e5);return `<tr><td class="l">${esc(r.token)}</td><td>${esc(r.code)}</td><td>${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}</td><td>${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}</td><td>${h} ساعة</td></tr>`}).join('')||'<tr><td>لا توجد طلبات بعد</td></tr>'}</table>`,'العرض لأحدث 100 طلب فقط.')}
function pwModal(){
 modal('🔑 كلمات المرور الثابتة',`<div style="padding:10px"><input id="pn" placeholder="الاسم"><input id="pv" dir="ltr" placeholder="كلمة المرور" style="margin-top:6px"><div class="msg" id="m"></div><button class="btn s" id="pa" style="width:100%">إضافة</button>
 ${pwds.map(p=>`<div class="it"><b>${esc(p.name)}</b> <span class="l" style="color:var(--mu)">${esc(p.val)}</span><br><button class="btn o s" data-pe="${p.id}" data-n="${esc(p.name)}">تعديل</button> <button class="btn r s" data-pd="${p.id}">حذف</button></div>`).join('')}</div>`);
 const done=()=>{$('#mo').innerHTML='';dash()};
 $('#pa').onclick=act(async()=>{await A('POST','/pwds',{name:$('#pn').value,val:$('#pv').value});done()});
 $('#mo').querySelectorAll('[data-pe]').forEach(b=>b.onclick=act(async()=>{const v=prompt('كلمة المرور الجديدة');if(v){await A('PUT','/pwds/'+b.dataset.pe,{name:b.dataset.n,val:v});done()}}));
